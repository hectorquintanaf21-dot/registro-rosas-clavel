<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiesta de Rosas & Clavel — Registro de Asistencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    max-width: 500px;
    width: 100%;
    padding: 40px 30px;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    text-align: center;
    color: #92400e;
    margin-bottom: 10px;
    font-size: 1.8rem;
  }
  .subtitulo {
    text-align: center;
    color: #b45309;
    margin-bottom: 30px;
    font-size: 1rem;
  }
  .grupo-form {
    margin-bottom: 22px;
  }
  label {
    display: block;
    margin-bottom: 8px;
    color: #78350f;
    font-weight: 500;
  }
  input, select, button {
    width: 100%;
    padding: 12px 15px;
    border: 2px solid #fcd34d;
    border-radius: 10px;
    font-size: 1rem;
    font-family: 'Inter', sans-serif;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  input:focus, select:focus {
    outline: none;
    border-color: #f59e0b;
    box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
  }
  button {
    background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    color: white;
    border: none;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
    font-size: 1.05rem;
  }
  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(217, 119, 6, 0.35);
  }
  .mensaje-exito {
    display: none;
    text-align: center;
    padding: 30px 20px;
  }
  .mensaje-exito h2 {
    font-family: 'Playfair Display', serif;
    color: #16a34a;
    margin-bottom: 10px;
  }
  .mensaje-exito p {
    color: #4b5563;
  }
</style>
</head>
<body>
  <div class="container">
    <div id="formulario">
      <h1>🌸 Fiesta de Rosas & Clavel</h1>
      <p class="subtitulo">Registro de Asistencia</p>
      
      <form action="https://formspree.io/f/xzegzgjy" method="POST">
        <div class="grupo-form">
          <label for="nombre">Nombre Completo</label>
          <input type="text" id="nombre" name="nombre" required placeholder="Escribe tu nombre completo">
        </div>

        <div class="grupo-form">
          <label for="rama">Rama</label>
          <select id="rama" name="rama" required>
            <option value="">Selecciona tu rama</option>
            <option>Abancay</option>
            <option>Tamburco</option>
            <option>Patibamba</option>
            <option>Intimpas</option>
            <option>Investigador</option>
          </select>
        </div>

        <div class="grupo-form">
          <label for="correo">Correo Electrónico</label>
          <input type="email" id="correo" name="correo" required placeholder="tu@correo.com">
        </div>

        <div class="grupo-form">
          <label for="mensaje">Mensaje (opcional)</label>
          <input type="text" id="mensaje" name="mensaje" placeholder="Escribe algo bonito 💛">
        </div>

        <button type="submit">✨ Enviar Registro</button>
      </form>
    </div>

    <div id="exito" class="mensaje-exito">
      <h2>✅ ¡Registrado con éxito!</h2>
      <p>Gracias por confirmar tu asistencia 💛<br>Nos vemos pronto 🌸</p>
    </div>
  </div>

  <script>
    const form = document.querySelector('form');
    form.addEventListener('submit', function(e) {
      const nombre = document.getElementById('nombre').value.trim();
      const rama = document.getElementById('rama').value;
      if (nombre.length < 3 || !rama) {
        e.preventDefault();
        alert('Por favor completa todos los campos correctamente ✅');
        return;
      }
      
      setTimeout(() => {
        document.getElementById('formulario').style.display = 'none';
        document.getElementById('exito').style.display = 'block';
      }, 500);
    });
  </script>
</body>
</html>
